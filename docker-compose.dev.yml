# ════════════════════════════════════════════════════════════════════════════════
# DEVELOPMENT ENVIRONMENT CONFIGURATION
# ════════════════════════════════════════════════════════════════════════════════
# Run with: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# Or use: docker compose --profile dev up
#
# Features:
# - Bind mounts for live code reload
# - Development-specific environment variables
# - Nodemon for automatic restart on file changes
# - Exposed ports for debugging

services:
  app:
    # Override for development
    build:
      context: .
      dockerfile: Dockerfile
    container_name: imprenta-app-dev
    command: npm run dev
    environment:
      PORT: "3000"
      NODE_ENV: development
    ports:
      - "3000:3000"
    volumes:
      # Bind mount entire app directory (except node_modules)
      - .:/app
      # Prevent node_modules from being overwritten by bind mount
      - /app/node_modules
      # Preserve data and uploads between restarts
      - app-data:/app/data
      - app-uploads:/app/public/uploads
    # Development: watch file changes with nodemon
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  app-data:
    driver: local
  app-uploads:
    driver: local
